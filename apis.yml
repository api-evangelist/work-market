aid: work-market
name: Work Market
description: >-
  WorkMarket, an ADP company, is an independent contractor management platform
  that helps businesses organize, manage, and pay their extended workforce of
  1099 contractors and freelancers. The platform covers contractor onboarding
  and verification, Labor Clouds for organizing talent by skill and location,
  assignment creation and tracking, compliance support, and fast payment
  processing. The WorkMarket Employer API exposes assignments, talent pools,
  address book, custom fields, labels, projects, and payment approval as a
  REST API, with webhooks, a Relay automation tool, and a certified MuleSoft
  connector for enterprise integration.
